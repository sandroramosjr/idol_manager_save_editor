name: Build binaries and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0). If omitted when dispatched, a run-number-based tag is used.'
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    outputs:
      artifact-name: windows-artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --noconsole --name idol-manager-windows main.py

      - name: Generate SHA256 checksum (Windows)
        shell: powershell
        run: |
          $exe = 'dist\\idol-manager-windows.exe'
          $hash = Get-FileHash $exe -Algorithm SHA256
          "{0}  {1}" -f $hash.Hash, (Split-Path $exe -Leaf) | Out-File -Encoding ascii dist\\idol-manager-windows.exe.sha256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/idol-manager-windows.exe
            dist/idol-manager-windows.exe.sha256

  build-macos:
    name: Build macOS binary
    runs-on: macos-latest
    outputs:
      artifact-name: macos-artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller

      - name: Build macOS binary
        run: |
          pyinstaller --onefile --name idol-manager-macos main.py

      - name: Package macOS artifact and checksum
        run: |
          ART=idol-manager-macos.zip
          mkdir -p release
          cp dist/idol-manager-macos release/idol-manager-macos
          cd release
          zip -r ../$ART .
          cd ..
          shasum -a 256 $ART > ${ART}.sha256

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            idol-manager-macos.zip
            idol-manager-macos.zip.sha256

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    env:
      TAG: ${{ github.ref_name || github.event.inputs.tag || format('v{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts

      - name: List artifacts (debug)
        run: ls -la

      - name: Create release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          files: |
            dist/idol-manager-windows.exe
            dist/idol-manager-windows.exe.sha256
            idol-manager-macos.zip
            idol-manager-macos.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
