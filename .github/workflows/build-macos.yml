name: Build macOS executable and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0). If omitted when dispatched, a run-number-based tag is used.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name || github.event.inputs.tag || format('v{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller

      - name: Build macOS binary
        run: |
          pyinstaller --onefile --name idol-manager-macos main.py

      - name: Package and checksum
        run: |
          ART=idol-manager-macos-${{ github.run_number }}.zip
          mkdir -p release
          cp dist/idol-manager-macos release/idol-manager-macos
          cd release && zip -r ../$ART . && cd ..
          shasum -a 256 $ART > ${ART}.sha256

      - name: Create GitHub release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          files: idol-manager-macos-${{ github.run_number }}.zip,idol-manager-macos-${{ github.run_number }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
