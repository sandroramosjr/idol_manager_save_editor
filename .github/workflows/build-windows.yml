name: Build Windows executable and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0). If omitted when dispatched, a run-number-based tag is used.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name || github.event.inputs.tag || format('v{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --noconsole --name idol-manager-windows main.py

      - name: Generate SHA256 checksum
        shell: powershell
        run: |
          $exe = 'dist\idol-manager-windows.exe'
          $hash = Get-FileHash $exe -Algorithm SHA256
          "{0}  {1}" -f $hash.Hash, (Split-Path $exe -Leaf) | Out-File -Encoding ascii dist\idol-manager-windows.exe.sha256

      - name: Create GitHub release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          files: dist/idol-manager-windows.exe,dist/idol-manager-windows.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
